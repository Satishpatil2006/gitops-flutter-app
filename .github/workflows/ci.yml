name: Flutter CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      # 3. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Build Flutter Web
      - name: Build Flutter Web
        run: flutter build web --release

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build latest image
      - name: Build latest Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-flutter-app:latest .

      # 7. Build version 2 image
      - name: Build v2 Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-flutter-app:v2 .

      # 8. Push latest image
      - name: Push latest Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/gitops-flutter-app:latest

      # 9. Push v2 image
      - name: Push v2 Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/gitops-flutter-app:v2
