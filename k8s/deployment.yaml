apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-flutter-app
  labels:
    app: gitops-flutter-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gitops-flutter-app

  template:
    metadata:
      labels:
        app: gitops-flutter-app

    spec:
      containers:
        - name: flutter-app

          image: satpatil75/gitops-flutter-app:v3

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "256Mi"
              cpu: "250m"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
