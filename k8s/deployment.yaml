apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-flutter-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-flutter-app
  template:
    metadata:
      labels:
        app: gitops-flutter-app
    spec:
      containers:
        - name: flutter-app
          image: gitops-flutter-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
